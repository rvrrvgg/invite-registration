name: Create app-id signature

# Run this manually from the Actions tab. It signs the app id
# "invite_registration" with your private signing key so you can paste the
# result into the "Signature" field when registering the app id on
# apps.nextcloud.com. Delete this workflow again once you have the signature.
on:
  workflow_dispatch:

jobs:
  make-signature:
    runs-on: ubuntu-latest
    steps:
      - name: Write the private key from the secret
        run: |
          mkdir -p out
          printf '%s' "${{ secrets.NEXTCLOUD_SIGNING_KEY }}" > out/invite_registration.key

      - name: Sign the app id
        run: |
          set -e
          echo -n "invite_registration" \
            | openssl dgst -sha512 -sign out/invite_registration.key \
            | openssl base64 -A > out/signature.txt
          echo "----- SIGNATURE START -----"
          cat out/signature.txt
          echo ""
          echo "----- SIGNATURE END -----"

      - name: Upload the signature as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-id-signature
          path: out/signature.txt
          retention-days: 1
